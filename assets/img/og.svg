<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Garrett Nunes — Founder building autonomous AI systems and e-commerce">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- subtle node constellation -->
  <g stroke="#5eead4" stroke-opacity="0.16" stroke-width="1">
    <line x1="930" y1="120" x2="1040" y2="200"/>
    <line x1="1040" y1="200" x2="980" y2="320"/>
    <line x1="980" y1="320" x2="1090" y2="380"/>
    <line x1="930" y1="120" x2="1090" y2="380"/>
    <line x1="1040" y1="200" x2="1120" y2="140"/>
  </g>
  <g fill="#5eead4" fill-opacity="0.55">
    <circle cx="930" cy="120" r="4"/>
    <circle cx="1040" cy="200" r="5"/>
    <circle cx="980" cy="320" r="4"/>
    <circle cx="1090" cy="380" r="4"/>
    <circle cx="1120" cy="140" r="3"/>
  </g>

  <!-- logo mark -->
  <rect x="80" y="80" width="84" height="84" rx="20" fill="url(#accent)"/>
  <text x="122" y="142" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="700" text-anchor="middle" fill="#04120f">G</text>

  <!-- eyebrow -->
  <text x="80" y="300" font-family="'JetBrains Mono', monospace" font-size="26" letter-spacing="2" fill="#9aa0ad">FOUNDER · MARYVILLE, TENNESSEE</text>

  <!-- headline -->
  <text x="80" y="380" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="800" fill="#e7e9ee">Garrett Nunes</text>
  <text x="80" y="470" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="600" fill="url(#accent)">Autonomous systems &#183; AI &#183; e-commerce</text>

  <!-- venture tags -->
  <g font-family="'JetBrains Mono', monospace" font-size="24" fill="#9aa0ad">
    <text x="80" y="555">Fazer Tech</text>
    <text x="290" y="555" fill="#6b7280">&#183;</text>
    <text x="320" y="555">OEM Wheel</text>
    <text x="520" y="555" fill="#6b7280">&#183;</text>
    <text x="550" y="555">Factory Parts</text>
  </g>

  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
