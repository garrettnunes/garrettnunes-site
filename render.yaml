# Render static-site deploy manifest for garrettnunes.com
# Docs: https://render.com/docs/static-sites
#
# This site has no backend. Render serves the repo root as static files.
# The "build" runs a quick link/HTML check (see package.json); it is
# optional — if you prefer zero build, set buildCommand to "" (empty).

services:
  - type: web
    name: garrettnunes-site
    runtime: static
    # Serve the repo root (index.html lives there).
    staticPublishPath: .
    # Minimal build: validate links/HTML before publish. Safe to blank out.
    buildCommand: "npm ci && npm run check"
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA-style fallback not needed (single page); serve 404 for unknowns.
      - type: rewrite
        source: /home
        destination: /index.html
